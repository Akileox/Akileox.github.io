<header class="site-header">
  <div class="site-header__inner">

    <a class="site-logo" href="{{ '/' | relative_url }}">
      <img class="site-logo__mark" src="{{ '/assets/images/logo.png' | relative_url }}" alt="Akileo">
    </a>

    <nav class="site-nav" id="site-nav">
      {%- for link in site.data.navigation.main -%}
        <a class="site-nav__link" href="{{ link.url | relative_url }}">{{ link.title }}</a>
      {%- endfor -%}
    </nav>

    <div class="site-header__right">
      <button class="site-header__theme-toggle" id="theme-toggle" aria-label="다크모드 전환">
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>

      <button class="site-header__hamburger" id="nav-toggle" aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>
    </div>

  </div>

  <!-- Mobile drawer -->
  <div class="site-nav-drawer" id="nav-drawer">
    {%- for link in site.data.navigation.main -%}
      <a href="{{ link.url | relative_url }}">{{ link.title }}</a>
    {%- endfor -%}
  </div>
</header>

<script>
  const toggle = document.getElementById('nav-toggle');
  const drawer = document.getElementById('nav-drawer');
  toggle.addEventListener('click', () => {
    drawer.classList.toggle('is-open');
    toggle.classList.toggle('is-open');
  });

  const themeToggle = document.getElementById('theme-toggle');
  themeToggle.addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('theme', next);
    if (window.reloadGiscusTheme) window.reloadGiscusTheme();
  });
</script>
